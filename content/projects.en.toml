[projects.snippet]
title = "translator.py (simplified)"
code = '''
import hashlib
import re

TAG = re.compile(r"</?([a-z0-9]+)[^>]*>", re.I)
NUM = re.compile(r"\d+(?:[.,]\d+)?")

SYSTEM = """You are a professional translator of e-commerce product pages.
Translate from Spanish into {lang}. Rules:
- Do not translate brands, models or units (ml, mg, W, Ω, mAh).
- Keep the HTML tags and their order EXACTLY as they are.
- Do not add or remove information.
- Mandatory glossary: {glossary}
Return only the translated text."""


def source_hash(text: str) -> str:
    return hashlib.sha256(text.encode("utf-8")).hexdigest()


def is_valid(original: str, translated: str) -> bool:
    same_markup = TAG.findall(original) == TAG.findall(translated)
    same_numbers = sorted(NUM.findall(original)) == sorted(NUM.findall(translated))
    return same_markup and same_numbers


def translate(llm, text: str, lang: str, glossary: dict[str, str], retries: int = 2) -> str:
    rules = "; ".join(f"{src} → {dst}" for src, dst in glossary.items())
    system = SYSTEM.format(lang=lang, glossary=rules)
    for _ in range(retries + 1):
        out = llm(system=system, user=text)
        if is_valid(text, out):
            return out
    raise ValueError("The translation failed validation (HTML or figures)")
'''


