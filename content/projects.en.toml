[projects.snippet]
title = "n8n · “Normalize parameters” node"
code = '''
// Accepts parameters from the webhook (query/body) or from another workflow.
const src = $input.first().json ?? {};
const q = { ...(src.query ?? {}), ...(src.body ?? {}) };

const pick = (...keys) => {
  for (const k of keys) for (const o of [q, src]) {
    const v = o?.[k];
    if (v !== undefined && v !== null && String(v).trim() !== '') return String(v).trim();
  }
  return null;
};

const shop  = pick('shop', 'id_shop', 'tienda');
const start = pick('start', 'inicio', 'fecha_inicio');
const end   = pick('end', 'fin', 'fecha_fin');

const example = '{"shop": "1", "start": "2026-08-11", "end": "2026-08-17"}';
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s ?? '');

if (!/^\d+$/.test(shop ?? '')) throw new Error(`shop must be the store's numeric id. Example: ${example}`);
if (!isDate(start) || !isDate(end)) throw new Error(`start and end must use the YYYY-MM-DD format. Example: ${example}`);
if (end < start) throw new Error(`Inverted range: start (${start}) is after end (${end})`);

return [{ json: { shop, start, end } }];
'''


