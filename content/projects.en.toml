[[projects]]
slug = "sistema-fba-amazon"
title = "FBA management system for Amazon"
kicker = "VapoSelección · Amazon FBA"
status = "In production"
period = "2025 - present"
role = "Design, development and maintenance"
context = "Multichannel e-commerce · 4 marketplaces"
summary = "Full automation of FBA operations across 4 marketplaces: SP-API reports, replenishment calculation, aged inventory by age band and FNSKU labels generated with no manual work."
tagline = "From downloading CSV files by hand to a system that works out what to send to Amazon and what to clear out, and generates the labels on its own."
problem = """
Amazon FBA operations in four countries relied on manual work: downloading reports from Seller Central, cross-referencing them in Excel to decide replenishment, eyeballing the inventory that hadn't sold in months, and preparing FNSKU labels and shipment templates one product at a time.

It was slow, it depended on one specific person and it was easy to get quantities or marketplaces wrong. On top of that, stock that doesn't move in FBA generates **long-term storage fees**, so spotting it late costs money.
"""
solution = """
I built a set of workflows on top of **Amazon SP-API**, orchestrated with **n8n** and backed by **Python** for data processing. Each workflow covers one part of the operation: replenishment, aged inventory, FNSKU labels and shipment templates.

Scheduled processes run on their own and deliver the result by email or to Google Drive. The ones that need a human decision (which shipment to prepare, for which marketplace) are launched from an **internal form**, without touching code or Seller Central.
"""
learnings = """
With external APIs, something will fail sooner or later (cancelled reports, empty files, rate limits). A message that explains what happened is worth more than retrying blindly, and it's what makes the team trust the automation.
"""
results = [
  "Replenishment calculated on a schedule with real sales and stock data from each marketplace.",
  "Visibility of aged inventory before it starts generating long-term storage fees.",
  "FNSKU labels for a full shipment generated in minutes from a form.",
  "The process no longer depends on one person: anyone on the team can run it.",
]

