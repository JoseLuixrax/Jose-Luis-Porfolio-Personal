lang = "python"
title = "odoo_stock.py (simplificado)"
code = '''
import os
import xmlrpc.client

URL = os.environ["ODOO_URL"]
DB = os.environ["ODOO_DB"]
USER = os.environ["ODOO_USER"]
API_KEY = os.environ["ODOO_API_KEY"]

uid = xmlrpc.client.ServerProxy(f"{URL}/xmlrpc/2/common").authenticate(DB, USER, API_KEY, {})
models = xmlrpc.client.ServerProxy(f"{URL}/xmlrpc/2/object")


def stock_by_location(default_code: str) -> dict[str, float]:
    """Stock disponible (cantidad - reservado) de una referencia por ubicación interna."""
    quants = models.execute_kw(
        DB, uid, API_KEY, "stock.quant", "search_read",
        [[["product_id.default_code", "=", default_code],
          ["location_id.usage", "=", "internal"]]],
        {"fields": ["location_id", "quantity", "reserved_quantity"]},
    )
    stock: dict[str, float] = {}
    for q in quants:
        location = q["location_id"][1]
        stock[location] = stock.get(location, 0) + q["quantity"] - q["reserved_quantity"]
    return stock
'''


