[projects.snippet]
lang = "python"
title = "xlsx_cleaner/main.py (simplificado)"
code = '''
from io import BytesIO

import pandas as pd
from fastapi import FastAPI, File, HTTPException, UploadFile
from fastapi.responses import StreamingResponse

app = FastAPI(title="xlsx-cleaner")
REQUIRED = {"referencia", "descripcion", "precio"}
XLSX = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"


def find_header_row(df: pd.DataFrame) -> int:
    for i, row in df.head(30).iterrows():
        values = {str(v).strip().lower() for v in row.dropna()}
        if REQUIRED <= values:
            return i
    raise HTTPException(422, f"No se encuentran las columnas {sorted(REQUIRED)}")


@app.post("/clean")
async def clean(file: UploadFile = File(...)):
    raw = pd.read_excel(BytesIO(await file.read()), header=None, dtype=str)
    header = find_header_row(raw)
    columns = raw.iloc[header].fillna("").str.strip().str.lower()
    df = raw.iloc[header + 1:].set_axis(columns, axis=1)
    df = df.dropna(how="all").drop_duplicates(subset="referencia")
    df["precio"] = pd.to_numeric(df["precio"].str.replace(",", "."), errors="coerce")

    out = BytesIO()
    df.to_excel(out, index=False)
    out.seek(0)
    return StreamingResponse(out, media_type=XLSX,
                             headers={"Content-Disposition": "attachment; filename=clean.xlsx"})
'''


