[projects.snippet]
lang = "yaml"
title = "docker-compose.yml (extracto)"
code = '''
services:
  nginx:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]    # el único servicio expuesto
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro      # un server por dominio
      - /etc/letsencrypt:/etc/letsencrypt:ro     # certificados de Certbot
    networks: [proxy]

  prestashop:
    build: ./prestashop            # php:7.4-apache + gd, intl, zip, pdo_mysql, opcache
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./shop:/var/www/html
    networks: [proxy, backend]     # Nginx le llega por la red proxy

  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    networks: [backend]            # sin puertos publicados

networks:
  proxy:
    name: proxy
  backend:
    internal: true

volumes:
  db_data:
'''


