status = "En producción"
period = "2025 - 2026"
role = "Diseño y ejecución completa de la migración"
context = "Tienda principal + ecosistema de automatización"
summary = "De un hosting compartido con Plesk a un VPS Ubuntu con Docker Compose, Nginx y HTTPS automático. PrestaShop 1.7 multi-tienda, n8n y microservicios bajo un mismo stack reproducible."
tagline = "Llevar la tienda principal y todo el ecosistema de automatización a una infraestructura propia, reproducible y bajo control."
tags = ["Docker", "Docker Compose", "Nginx", "PrestaShop 1.7", "PHP 7.4", "MariaDB", "Ubuntu 22.04"]
confidential = true
problem = """
La tienda corría en un hosting compartido gestionado con Plesk: recursos limitados y compartidos con otros clientes, sin control sobre la versión de PHP ni sobre el servidor, y sin un lugar donde desplegar las herramientas propias que la empresa empezaba a necesitar (n8n, microservicios, ERP).

Cada pieza nueva acababa siendo un servicio externo más o un parche sobre el hosting.
"""
solution = """
Diseñé una plataforma sobre un **VPS Ubuntu 22.04** (12 vCPU, 24 GB de RAM y 720 GB NVMe) donde cada servicio vive en su contenedor y se define en **Docker Compose**. **Nginx** actúa como reverse proxy único: enruta cada dominio a su contenedor y termina TLS con certificados Let's Encrypt que Certbot renueva de forma automática.

Migré **PrestaShop 1.7.8 multi-tienda** con su base de datos **MariaDB**, ficheros e imágenes, manteniendo **PHP 7.4** en una imagen fijada para no romper módulos, y dejé n8n y los microservicios en el mismo stack con redes internas separadas: la base de datos nunca queda expuesta a Internet.
"""
learnings = """
Una migración es sobre todo inventario: listar antes de mover nada las dependencias ocultas (tareas cron, envío de emails SMTP, rutas absolutas, módulos que escriben en disco, dominios guardados en base de datos) evita la mayoría de sorpresas el día del cambio.
"""
