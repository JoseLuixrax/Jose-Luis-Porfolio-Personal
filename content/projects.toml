note = "Código abierto: el proyecto completo está en GitHub."
code = '''
async function loadPokemon() {
  try {
    const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025&offset=0');
    const data = await res.json();

    state.allPokemon = data.results.map((p) => p.name).sort();
    data.results.forEach((p) => {
      const id = parseInt(p.url.split('/').filter(Boolean).pop(), 10);
      state.pokemonMap[p.name] = {
        name: p.name,
        id,
        gen: getPokemonGen(id),
        sprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`,
      };
    });

    renderArena();
  } catch (err) {
    console.error(err);
  }
}
'''
