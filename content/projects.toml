[projects.snippet]
lang = "python"
title = "spapi_reports.py"
code = '''
import gzip
import time

import requests

SP_API = "https://sellingpartnerapi-eu.amazon.com"


def lwa_token(client_id: str, client_secret: str, refresh_token: str) -> str:
    r = requests.post("https://api.amazon.com/auth/o2/token", data={
        "grant_type": "refresh_token",
        "refresh_token": refresh_token,
        "client_id": client_id,
        "client_secret": client_secret,
    }, timeout=30)
    r.raise_for_status()
    return r.json()["access_token"]


def download_report(token: str, report_type: str, marketplace_id: str) -> str:
    h = {"x-amz-access-token": token}
    report_id = requests.post(f"{SP_API}/reports/2021-06-30/reports", headers=h, json={
        "reportType": report_type,
        "marketplaceIds": [marketplace_id],
    }, timeout=30).json()["reportId"]

    for wait in (15, 30, 60, 60, 120, 120, 300):  # backoff progresivo
        time.sleep(wait)
        rep = requests.get(f"{SP_API}/reports/2021-06-30/reports/{report_id}",
                           headers=h, timeout=30).json()
        if rep["processingStatus"] == "DONE":
            break
        if rep["processingStatus"] in ("FATAL", "CANCELLED"):
            raise RuntimeError(f"{report_type} [{marketplace_id}]: {rep['processingStatus']}")
    else:
        raise TimeoutError(f"El reporte {report_id} no ha terminado a tiempo")

    doc = requests.get(f"{SP_API}/reports/2021-06-30/documents/{rep['reportDocumentId']}",
                       headers=h, timeout=30).json()
    raw = requests.get(doc["url"], timeout=120).content
    if doc.get("compressionAlgorithm") == "GZIP":
        raw = gzip.decompress(raw)
    return raw.decode("utf-8", errors="replace")
'''


