confidential = true
problem = """
Vender en Francia, Alemania e Italia exige fichas de producto en el idioma del cliente. Traducir a mano cientos de descripciones no escala.

Los traductores automáticos genéricos tampoco servían: rompían el HTML de las fichas, traducían marcas o términos técnicos del sector que deben quedarse como están y no mantenían un tono consistente entre productos.
